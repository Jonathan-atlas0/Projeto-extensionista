spring:
  application:
    name: backend

  profiles:
    active: dev

  datasource:
    url: jdbc:postgresql://localhost:5432/financeiro
    username: seu_usuario_postgres
    password: sua_senha_postgres
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

jwt:
  secret: troque_por_uma_chave_local_com_mais_de_32_caracteres
  expiration: 86400000

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.springframework.security: INFO
    com.financeiro: INFO

ADMIN_EMAIL: admin@fineduca.local
ADMIN_PASSWORD: 123456
ADMIN_NAME: Administrador Demo
